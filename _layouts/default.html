<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}
  </title>
  <link rel="icon" href="/assets/images/project-logo.png" type="image/x-icon">

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="site-header">
    <div class="container navigation">
      <a class="brand" href="{{ '/' | relative_url }}">
        BL Monitor and Control AB
      </a>

      <nav class="nav-links" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blinky-lite/' | relative_url }}">Blinky-Lite</a>
        <a href="{{ '/products/' | relative_url }}">Instrumentation</a>
        <a href="{{ '/case-studies/' | relative_url }}">Case Studies</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-content">
      <div>
        <strong>BL Monitor and Control AB</strong>
        <p>Control software, instrumentation and integration.</p>
      </div>

      <div>
        <a href="mailto:info@bl-mc.se">info@bl-mc.se</a>
        <br>
        <a href="{{ '/blinky-lite/' | relative_url }}">Blinky-Lite™</a>
        &nbsp;·&nbsp;
        <a href="{{ '/products/' | relative_url }}">Instrumentation</a>
      </div>
    </div>
  </footer>
  {% include video-modal.html %}
  <script src="{{ '/assets/js/video-modal.js' | relative_url }}" defer></script>
</body>
</html>
